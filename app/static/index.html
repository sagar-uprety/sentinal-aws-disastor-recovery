<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1ea">
  <title>Sentinel — DR Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script>
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
  <main>
    <header>
      <h1>Sentinel <span>Monitor</span></h1>
      <button id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.64 15.35A9 9 0 1 1 8.65 3.36 7 7 0 0 0 20.64 15.35z"/></svg>
      </button>
    </header>

    <div id="banner"><span class="dot"></span> All systems operational</div>

    <div class="section-label">Recovery topology</div>
    <p id="topology-updated"><span class="dot"></span>Loading runtime metadata</p>
    <div class="topo-grid" id="topology-grid"></div>

    <div class="section-label">Drill timeline</div>
    <div class="events-box" id="events"><div class="inner"><p class="empty">Loading drill events...</p></div></div>

    <div class="section-label">Monitored services</div>
    <div id="cards"></div>
    <p id="refresh">Refreshes every 15 s</p>
  </main>

  <script>
    const REFRESH_MS = 15000;
    const BAR_COUNT = 50;

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0f172a' : '#f4f1ea';
      fetchAll();
    });

    function hostname(url) { try { return new URL(url).hostname; } catch { return url; } }
    function esc(v) { return String(v || '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[c]); }
    function timeAgo(t) {
      const s = Math.floor((Date.now() - new Date(t).getTime()) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      return m < 60 ? m + 'm ago' : Math.floor(m / 60) + 'h ago';
    }

    function regionCard(entry, index) {
      const c = entry.compute || {};
      const d = entry.database || {};
      const computeReady = c.available && c.desired > 0 && c.running >= c.desired;
      const dbReady = d.available;
      const healthy = computeReady && dbReady;
      const role = index === 0 ? 'Production' : 'Disaster Recovery';
      const regionClass = index === 0 ? 'prod' : 'dr';
      const healthClass = healthy ? 'green' : 'red';

      const zones = Array.isArray(c.availability_zones) && c.availability_zones.length > 0
        ? c.availability_zones.map(z => '<span class="az-tag">' + esc(z) + '</span>').join('')
        : '<span class="status-badge unavailable">None</span>';

      const tasks = Array.isArray(c.tasks) && c.tasks.length > 0
        ? c.tasks.join(', ')
        : '—';

      return '<article class="region-card ' + regionClass + '">' +
        '<div class="topbar">' +
          '<span class="role">' + role + '</span>' +
          '<span class="region-name">' + esc(entry.region) + '</span>' +
          '<span class="health-badge ' + healthClass + '">' + (healthy ? 'Healthy' : 'Degraded') + '</span>' +
        '</div>' +
        '<div class="body">' +
          '<div class="section-group">' +
            '<h3>Compute · ECS</h3>' +
            '<div class="detail-row"><span class="label">Service</span><span class="value">' + esc(c.name) + '</span></div>' +
            '<div class="detail-row"><span class="label">Tasks</span><span class="value"><strong>' + (c.running || 0) + '</strong> / ' + (c.desired || 0) + ' running</span></div>' +
            '<div class="detail-row"><span class="label">Availability zones</span><div class="value"><div class="az-tags">' + zones + '</div></div></div>' +
            '<div class="detail-row"><span class="label">Task IDs</span><span class="value task-id" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">' + esc(tasks) + '</span></div>' +
          '</div>' +
          '<div class="section-group">' +
            '<h3>Database · RDS PostgreSQL</h3>' +
            '<div class="detail-row"><span class="label">Identifier</span><span class="value">' + esc(d.identifier) + '</span></div>' +
            '<div class="detail-row"><span class="label">Role</span><span class="value status-badge ' + (d.role === 'writer' ? 'available' : 'available') + '">' + esc(d.role) + '</span></div>' +
            '<div class="detail-row"><span class="label">Status</span><span class="value status-badge ' + (d.status === 'available' ? 'available' : 'unavailable') + '">' + esc(d.status) + '</span></div>' +
            '<div class="detail-row"><span class="label">Primary AZ</span><span class="value">' + esc(d.availability_zone) + '</span></div>' +
            (d.secondary_availability_zone ? '<div class="detail-row"><span class="label">Standby AZ</span><span class="value">' + esc(d.secondary_availability_zone) + '</span></div>' : '') +
            '<div class="detail-row"><span class="label">Multi-AZ</span><span class="value">' + (d.multi_az ? 'Yes' : 'No') + '</span></div>' +
            (d.read_replica_source ? '<div class="detail-row"><span class="label">Replica source</span><span class="value task-id">' + esc(d.read_replica_source.split(':').pop()) + '</span></div>' : '') +
          '</div>' +
        '</div>' +
      '</article>';
    }

    function renderTopology(top) {
      const grid = document.getElementById('topology-grid');
      const badge = document.getElementById('topology-updated');
      if (!top || !Array.isArray(top.regions)) {
        grid.innerHTML = regionCard({ region: 'Unavailable', compute: { available: false }, database: { status: 'offline', role: '—', identifier: '—', availability_zone: '—', multi_az: false } }, 0);
        badge.innerHTML = '<span class="dot" style="background:var(--red)"></span>Failed to load';
        return;
      }
      if (top.regions.length === 0) {
        grid.innerHTML = '<article class="region-card" style="grid-column:1/-1"><div class="body" style="text-align:center;padding:40px;color:var(--muted)"><p style="font-size:18px;font-weight:700;font-family:Fredoka,sans-serif">No topology data</p><p style="margin-top:8px">AWS topology not configured or unavailable</p></div></article>';
        badge.innerHTML = '<span class="dot" style="background:var(--amber)"></span>Local mode — topology disabled';
        return;
      }
      let allOK = true;
      grid.innerHTML = top.regions.map((entry, index) => {
        const c = entry.compute || {};
        const d = entry.database || {};
        const computeReady = c.available && c.desired > 0 && c.running >= c.desired;
        const dbReady = d.available;
        const healthy = computeReady && dbReady;
        allOK = allOK && healthy;
        return regionCard(entry, index);
      }).join('');
      badge.innerHTML = '<span class="dot" style="background:' + (allOK ? 'var(--green)' : 'var(--amber)') + '"></span>' +
        (allOK ? 'Both regions healthy' : 'Degraded — check region cards');
    }

    function renderEvents(events) {
      const container = document.getElementById('events');
      if (!events || events.length === 0) {
        container.innerHTML = '<div class="inner"><p class="empty">No drill events recorded yet.</p></div>';
        return;
      }
      container.innerHTML = '<div class="inner"><ol>' + events.map(e => {
        const label = e.value ? e.name + ': ' + e.value : e.name;
        return '<li><span class="evt-dot"></span><span class="evt-label" title="' + esc(label) + '">' + esc(label) + '</span><time class="evt-time" datetime="' + esc(e.timestamp) + '" title="' + esc(new Date(e.timestamp).toLocaleString()) + '">' + timeAgo(e.timestamp) + '</time></li>';
      }).join('') + '</ol></div>';
    }

    function renderBanner(statuses) {
      const el = document.getElementById('banner');
      const allUp = statuses.every(s => s.is_up);
      if (allUp) {
        el.className = '';
        el.innerHTML = '<span class="dot"></span> All systems operational';
      } else {
        const down = statuses.filter(s => !s.is_up);
        el.className = down.length === statuses.length ? 'down' : 'degraded';
        el.innerHTML = '<span class="dot"></span> ' + down.length + ' service' + (down.length > 1 ? 's' : '') + ' experiencing issues';
      }
    }

    function renderTimeline(host, checks) {
      const container = document.getElementById('tl-' + esc(host));
      if (!container || !checks || !checks.length) return;
      const slice = checks.slice(0, BAR_COUNT).reverse();
      const barW = 14, barH = 36, gap = 3, rx = 3;
      const totalW = slice.length * (barW + gap) - gap;
      const labelH = 18;
      const svgH = barH + labelH + 4;

      const rects = slice.map((c, i) => {
        const x = i * (barW + gap);
        const fill = c.is_up ? 'var(--green,#00a651)' : 'var(--red,#ed1c24)';
        const opacity = c.is_up ? '0.7' : '1';
        const tip = c.is_up ? 'Up · ' + c.response_ms + 'ms' : 'Down';
        return '<rect x="' + x + '" y="' + labelH + '" width="' + barW + '" height="' + barH + '" rx="' + rx + '" fill="' + fill + '" opacity="' + opacity + '"><title>' + tip + '</title></rect>';
      }).join('');

      container.innerHTML =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + totalW + '" height="' + svgH + '" viewBox="0 0 ' + totalW + ' ' + svgH + '" role="img" aria-label="Timeline for ' + esc(host) + '" style="display:block;max-width:none">' +
          '<text x="0" y="12" font-size="10" font-family="system-ui,sans-serif" fill="var(--muted)">-25 min</text>' +
          '<text x="' + Math.max(0, totalW - 28) + '" y="12" font-size="10" font-family="system-ui,sans-serif" fill="var(--muted)">now</text>' +
          rects +
        '</svg>' +
        '<div class="timeline-legend">' +
          '<span><span class="swatch" style="background:var(--green);opacity:.7"></span> Reachable (2xx/3xx)</span>' +
          '<span><span class="swatch" style="background:var(--red)"></span> Unreachable</span>' +
          '<span><span class="swatch" style="background:var(--border)"></span> No data</span>' +
        '</div>';
    }

    function renderCards(statuses) {
      const container = document.getElementById('cards');
      if (!statuses || statuses.length === 0) {
        container.innerHTML = '<div class="service-card"><div class="head"><span class="name">Waiting for checks...</span></div></div>';
        return;
      }
      container.innerHTML = statuses.map(s => {
        const h = hostname(s.url);
        const dotColor = s.is_up ? 'var(--green)' : 'var(--red)';
        const statusText = s.is_up ? 'Operational' : 'Down';
        const statusColor = s.is_up ? 'var(--green)' : 'var(--red)';
        return '<div class="service-card">' +
          '<div class="head">' +
            '<span class="name"><span class="dot" style="background:' + dotColor + '"></span>' + esc(h) + '</span>' +
            '<span class="ago">' + timeAgo(s.last_checked) + '</span>' +
          '</div>' +
          '<div class="metrics">' +
            '<div><strong>' + s.response_ms + '</strong><span class="muted">ms</span></div>' +
            '<div><strong>' + s.uptime_pct_24h + '</strong><span class="muted">% uptime (24h)</span></div>' +
            '<div style="margin-left:auto;font-weight:700;color:' + statusColor + '">' + statusText + '</div>' +
          '</div>' +
          '<div class="timeline"><div id="tl-' + esc(h) + '"></div></div>' +
        '</div>';
      }).join('');
    }

    async function fetchAll() {
      try {
        const [statuses, topology, events] = await Promise.all([
          fetch('/status').then(r => r.json()),
          fetch('/topology').then(r => r.ok ? r.json() : null),
          fetch('/events?limit=20').then(r => r.ok ? r.json() : []),
        ]);
        renderBanner(statuses);
        renderTopology(topology);
        renderEvents(events);
        renderCards(statuses);
        const histories = await Promise.all(
          statuses.map(s =>
            fetch('/history?target=' + encodeURIComponent(s.url) + '&limit=100')
              .then(r => r.json())
              .then(checks => ({ host: hostname(s.url), checks }))
          )
        );
        for (const { host, checks } of histories) {
          renderTimeline(host, checks);
        }
      } catch (err) {
        renderTopology(null);
        document.getElementById('events').innerHTML = '<div class="inner"><p class="empty" style="color:var(--red)">Unable to load drill events.</p></div>';
        document.getElementById('cards').innerHTML = '<div class="service-card"><div class="head"><span class="name" style="color:var(--red)">Unable to fetch status. Retrying...</span></div></div>';
      }
    }

    fetchAll();
    setInterval(fetchAll, REFRESH_MS);
  </script>
</body>
</html>
