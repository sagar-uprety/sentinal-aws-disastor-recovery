<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>Sentinel Status</title>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="bg-background text-foreground antialiased">
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">

    <!-- Header -->
    <header class="mb-10 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Sentinel</h1>
        <p class="mt-1 text-sm text-muted-foreground">AWS disaster-recovery status page</p>
      </div>
      <button id="theme-toggle" type="button"
        class="inline-flex size-9 items-center justify-center rounded-lg border bg-card text-muted-foreground transition-colors hover:bg-muted hover:text-foreground"
        aria-label="Toggle theme">
        <svg class="size-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="hidden size-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.64 15.35A9 9 0 1 1 8.65 3.36 7 7 0 0 0 20.64 15.35z"/></svg>
      </button>
    </header>

    <!-- System banner -->
    <div id="banner" class="mb-8 flex items-center gap-3 rounded-xl border bg-card px-5 py-3.5 text-sm font-medium" role="status" aria-live="polite">
      <span class="size-2 shrink-0 rounded-full bg-muted-foreground"></span>
      Loading status&hellip;
    </div>

    <!-- Recovery topology -->
    <section class="mb-10" aria-labelledby="topology-heading">
      <h2 id="topology-heading" class="mb-3 text-xs font-semibold uppercase tracking-widest text-muted-foreground">Recovery topology</h2>
      <p id="topology-updated" class="mb-3 inline-flex items-center gap-2 rounded-full border bg-muted/40 px-3 py-1 text-xs text-muted-foreground">
        <span class="size-1.5 rounded-full bg-muted-foreground"></span>Loading runtime metadata
      </p>
      <div id="topology-grid" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
      <p class="mt-3 text-xs leading-5 text-muted-foreground">Live request path from serving task to compute spread and database authority.</p>
    </section>

    <!-- Monitored services -->
    <section aria-labelledby="services-heading">
      <h2 id="services-heading" class="mb-3 text-xs font-semibold uppercase tracking-widest text-muted-foreground">Monitored services</h2>
      <div id="cards" class="grid gap-4"></div>
      <p id="refresh" class="mt-3 text-xs text-muted-foreground">Refreshes every 15 s</p>
    </section>

  </main>

  <script>
    const REFRESH_MS = 15000;
    const BAR_COUNT = 50;

    /* ── Theme toggle ── */
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').content = dark ? '#1a1f2e' : '#f8fafc';
      fetchAll();
    });

    /* ── Helpers ── */
    function hostname(url) { try { return new URL(url).hostname; } catch { return url; } }
    function esc(v) { return String(v || '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[c]); }
    function timeAgo(t) {
      const s = Math.floor((Date.now() - new Date(t).getTime()) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      return m < 60 ? m + 'm ago' : Math.floor(m / 60) + 'h ago';
    }

    /* ── Topology ── */
    function renderTopology(top) {
      const grid = document.getElementById('topology-grid');
      const badge = document.getElementById('topology-updated');
      if (!top) {
        grid.innerHTML = topoCard({ label: 'Application', marker: 'AP', name: 'Unavailable', badge: 'Offline', badgeColor: 'red', details: [] });
        badge.innerHTML = '<span class="size-1.5 rounded-full bg-red-500"></span>Retrying next refresh';
        return;
      }
      const a = top.application || {};
      const c = top.compute || {};
      const d = top.database || {};

      const appDetails = [
        ['Region', a.region],
        ['AZ', a.availability_zone],
        ['Task definition', a.task_definition],
        ['Revision', a.revision],
      ];
      const computeReady = c.available && c.desired_count > 0 && c.running_count === c.desired_count && c.multi_az;
      const zones = Array.isArray(c.availability_zones) ? c.availability_zones.join(', ') : '—';
      const taskCount = c.running_count + ' / ' + c.desired_count;
      const computeDetails = [
        ['Region', c.region],
        ['Running tasks', taskCount],
        ['Availability zones', zones],
      ];

      const dbOK = d.available && d.role === 'writer' && d.multi_az;
      const dbBadge = d.available
        ? (d.role === 'writer' ? (d.multi_az ? 'Writer · Multi-AZ' : 'Writer · single-AZ') : 'Read replica')
        : 'Unavailable';
      const dbBadgeColor = dbOK ? 'green' : (d.available ? 'amber' : 'red');
      const standby = d.secondary_availability_zone || (d.multi_az ? 'Hidden (AZ not disclosed)' : 'None');
      const dbDetails = [
        ['Region', d.region],
        ['Writer AZ', d.availability_zone],
        ['Standby AZ', standby],
      ];
      if (d.read_replica_source) {
        dbDetails.push(['Replicates from', d.read_replica_source.split(':').pop()]);
      }
      dbDetails.push(['Status', d.status]);

      grid.innerHTML =
        topoCard({ label: 'Application', marker: 'AP', name: a.task_definition || 'Local dev', badge: a.launch_type || 'local', badgeColor: 'green', details: appDetails }) +
        topoCard({ label: 'Compute', marker: 'ECS', name: c.name || '—', badge: computeReady ? 'Healthy' : 'Degraded', badgeColor: computeReady ? 'green' : 'red', details: computeDetails }) +
        topoCard({ label: 'Database', marker: 'DB', name: d.identifier || '—', badge: dbBadge, badgeColor: dbBadgeColor, details: dbDetails });

      const allOK = computeReady && dbOK;
      badge.innerHTML = '<span class="size-1.5 rounded-full ' + (allOK ? 'bg-emerald-500' : 'bg-amber-500') + '"></span>' +
        (allOK ? 'All layers healthy' : 'Degraded — check cards below');
    }

    function topoCard(o) {
      const colors = { green: 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400', amber: 'bg-amber-500/10 text-amber-700 dark:text-amber-400', red: 'bg-red-500/10 text-red-700 dark:text-red-400' };
      const barColors = { green: 'bg-emerald-500', amber: 'bg-amber-500', red: 'bg-red-500' };
      const rows = o.details.map(([k, v]) =>
        '<div class="flex items-baseline justify-between gap-2 py-1.5 border-t border-border/50 first:border-0 first:pt-0 last:pb-0">' +
          '<span class="text-xs text-muted-foreground shrink-0">' + esc(k) + '</span>' +
          '<span class="text-xs font-medium text-right min-w-0 break-words">' + esc(v) + '</span>' +
        '</div>'
      ).join('');
      return '<article class="rounded-xl border bg-card shadow-sm overflow-hidden">' +
        '<div class="h-0.5 ' + (barColors[o.badgeColor] || barColors.green) + '"></div>' +
        '<div class="px-5 py-4">' +
          '<div class="flex items-center justify-between mb-3">' +
            '<div class="flex items-center gap-2.5">' +
              '<span class="inline-flex size-7 items-center justify-center rounded-lg bg-muted font-mono text-[10px] font-bold text-muted-foreground">' + o.marker + '</span>' +
              '<div>' +
                '<p class="text-[10px] font-medium uppercase tracking-widest text-muted-foreground">' + esc(o.label) + '</p>' +
                '<h3 class="text-sm font-semibold leading-tight mt-0.5 truncate max-w-[200px]" title="' + esc(o.name) + '">' + esc(o.name) + '</h3>' +
              '</div>' +
            '</div>' +
            '<span class="inline-flex shrink-0 rounded-full px-2.5 py-1 text-[11px] font-medium ' + (colors[o.badgeColor] || colors.green) + '">' + esc(o.badge) + '</span>' +
          '</div>' +
          '<dl>' + rows + '</dl>' +
        '</div>' +
      '</article>';
    }

    /* ── Status banner ── */
    function renderBanner(statuses) {
      const el = document.getElementById('banner');
      const allUp = statuses.every(s => s.is_up);
      if (allUp) {
        el.className = 'mb-8 flex items-center gap-3 rounded-xl border border-emerald-500/20 bg-emerald-500/5 px-5 py-3.5 text-sm font-medium text-emerald-700 dark:text-emerald-400';
        el.innerHTML = '<span class="size-2 shrink-0 rounded-full bg-emerald-500"></span>All systems operational';
      } else {
        const downCount = statuses.filter(s => !s.is_up).length;
        el.className = 'mb-8 flex items-center gap-3 rounded-xl border border-red-500/20 bg-red-500/5 px-5 py-3.5 text-sm font-medium text-red-700 dark:text-red-400';
        el.innerHTML = '<span class="size-2 shrink-0 rounded-full bg-red-500"></span>' + downCount + ' service' + (downCount > 1 ? 's' : '') + ' experiencing issues';
      }
    }

    /* ── Availability timeline (SVG) ── */
    function renderTimeline(host, checks) {
      const container = document.getElementById('timeline-' + CSS.escape(host));
      if (!container || !checks || !checks.length) return;
      const slice = checks.slice(0, BAR_COUNT).reverse();
      const barW = 14, barH = 36, gap = 3, rx = 3;
      const totalW = slice.length * (barW + gap) - gap;
      const labelH = 18;
      const svgH = barH + labelH + 4;

      const rects = slice.map((c, i) => {
        const x = i * (barW + gap);
        const fill = c.is_up ? '#10b981' : '#ef4444';
        const opacity = c.is_up ? '0.75' : '1';
        const tip = c.is_up ? 'Up · ' + c.response_ms + 'ms' : 'Down';
        return '<rect x="' + x + '" y="' + labelH + '" width="' + barW + '" height="' + barH + '" rx="' + rx + '" fill="' + fill + '" opacity="' + opacity + '"><title>' + tip + '</title></rect>';
      }).join('');

      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + totalW + '" height="' + svgH + '" viewBox="0 0 ' + totalW + ' ' + svgH + '" role="img" aria-label="Availability timeline for ' + esc(host) + '" class="block w-full max-w-full">' +
          '<text x="0" y="12" font-size="10" font-family="system-ui,sans-serif" fill="currentColor" opacity="0.45">−25 min</text>' +
          '<text x="' + Math.max(0, totalW - 32) + '" y="12" font-size="10" font-family="system-ui,sans-serif" fill="currentColor" opacity="0.45">now</text>' +
          rects +
        '</svg>';

      const legend =
        '<div class="mt-2 flex items-center gap-4 text-[11px] text-muted-foreground">' +
          '<span class="inline-flex items-center gap-1.5"><span class="inline-block size-2.5 rounded-sm bg-emerald-500 opacity-75"></span>Up</span>' +
          '<span class="inline-flex items-center gap-1.5"><span class="inline-block size-2.5 rounded-sm bg-red-500"></span>Down</span>' +
          '<span class="inline-flex items-center gap-1.5"><span class="inline-block size-2.5 rounded-sm bg-border"></span>No check</span>' +
        '</div>';

      container.innerHTML = svg + legend;
    }

    /* ── Service cards ── */
    function renderCards(statuses) {
      const container = document.getElementById('cards');
      if (!statuses || statuses.length === 0) {
        container.innerHTML = '<div class="rounded-xl border bg-card px-5 py-12 text-center text-sm text-muted-foreground">Waiting for first check results&hellip;</div>';
        return;
      }
      container.innerHTML = statuses.map(s => {
        const h = hostname(s.url);
        const dotColor = s.is_up ? 'bg-emerald-500' : 'bg-red-500';
        const statusText = s.is_up ? 'Operational' : 'Down';
        const statusColor = s.is_up ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400';
        return '<article class="rounded-xl border bg-card shadow-sm overflow-hidden">' +
          '<div class="px-5 py-4">' +
            '<div class="flex items-center justify-between mb-3">' +
              '<div class="flex items-center gap-2.5">' +
                '<span class="size-2.5 shrink-0 rounded-full ' + dotColor + '"></span>' +
                '<h3 class="text-sm font-semibold">' + esc(h) + '</h3>' +
              '</div>' +
              '<span class="text-[11px] text-muted-foreground">' + timeAgo(s.last_checked) + '</span>' +
            '</div>' +
            '<div class="flex items-center gap-5 text-sm">' +
              '<div><span class="font-semibold">' + s.response_ms + '</span> <span class="text-muted-foreground">ms</span></div>' +
              '<div><span class="font-semibold">' + s.uptime_pct_24h + '</span> <span class="text-muted-foreground">% uptime (24 h)</span></div>' +
              '<span class="ml-auto text-xs font-medium ' + statusColor + '">' + statusText + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="border-t bg-muted/20 px-5 py-3">' +
            '<div id="timeline-' + esc(h) + '"></div>' +
          '</div>' +
        '</article>';
      }).join('');
    }

    /* ── Fetch & render ── */
    async function fetchAll() {
      try {
        const [statuses, topology] = await Promise.all([
          fetch('/status').then(r => r.json()),
          fetch('/topology').then(r => r.ok ? r.json() : null),
        ]);
        renderBanner(statuses);
        renderTopology(topology);
        renderCards(statuses);
        const histories = await Promise.all(
          statuses.map(s =>
            fetch('/history?target=' + encodeURIComponent(s.url) + '&limit=100')
              .then(r => r.json())
              .then(checks => ({ host: hostname(s.url), checks }))
          )
        );
        for (const { host, checks } of histories) {
          renderTimeline(host, checks);
        }
      } catch (err) {
        renderTopology(null);
        document.getElementById('cards').innerHTML =
          '<div class="rounded-xl border border-red-500/20 bg-red-500/5 px-5 py-12 text-center text-sm text-red-700 dark:text-red-400">Unable to fetch status. Retrying&hellip;</div>';
      }
    }

    fetchAll();
    setInterval(fetchAll, REFRESH_MS);
  </script>
</body>
</html>
