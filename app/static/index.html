<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>Sentinel Status</title>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/uPlot.min.css">
  <script src="/uPlot.iife.min.js"></script>
</head>
<body>
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-10">
    <header class="mb-8 flex items-center justify-between gap-4">
      <div>
        <p class="text-sm font-medium text-muted-foreground">Infrastructure monitoring</p>
        <h1 class="mt-1 text-2xl font-semibold tracking-tight sm:text-3xl">Sentinel status</h1>
      </div>
      <button id="theme-toggle" type="button" class="inline-flex size-10 shrink-0 items-center justify-center rounded-md border bg-card text-muted-foreground transition-colors hover:bg-muted hover:text-foreground" aria-label="Switch color theme">
        <svg class="size-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="hidden size-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.64 15.35A9 9 0 1 1 8.65 3.36 7 7 0 0 0 20.64 15.35z"/></svg>
      </button>
    </header>

    <section id="banner" class="mb-6 flex items-center gap-3 rounded-lg border bg-card px-4 py-3 text-sm font-medium" role="status" aria-live="polite">
      <span class="size-2 shrink-0 rounded-full bg-muted-foreground"></span>
      Loading status
    </section>

    <section class="mb-8 overflow-hidden rounded-lg border bg-card shadow-sm" aria-labelledby="topology-title">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b px-5 py-4 sm:px-6">
        <div>
          <p class="text-xs font-medium uppercase tracking-widest text-muted-foreground">Runtime view</p>
          <h2 id="topology-title" class="mt-1 text-base font-semibold">Recovery topology</h2>
        </div>
        <p id="topology-updated" class="inline-flex items-center gap-2 rounded-full border bg-muted/40 px-3 py-1.5 text-xs text-muted-foreground"><span class="size-1.5 rounded-full bg-muted-foreground"></span>Loading runtime metadata</p>
      </div>
      <div id="topology-grid" class="grid gap-3 bg-muted/30 p-3 lg:grid-cols-3"></div>
      <p class="border-t px-5 py-3 text-xs leading-5 text-muted-foreground sm:px-6">Live request path from serving task to compute spread and database authority. Managed standby does not accept application traffic.</p>
    </section>

    <section aria-labelledby="checks-title">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="checks-title" class="text-base font-semibold">Monitored services</h2>
        <p id="refresh" class="text-xs text-muted-foreground">Refreshes every 15s</p>
      </div>
      <div id="cards" class="grid gap-3"></div>
    </section>
  </main>

  <script>
    const REFRESH_MS = 15000;
    const BAR_COUNT = 50;

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').content = dark ? '#202938' : '#f8fafc';
      fetchChecks();
    });

    function hostname(url) {
      try { return new URL(url).hostname; } catch { return url; }
    }

    function escapeHTML(value) {
      return String(value || 'Unavailable').replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[c]);
    }

    function node(marker, label, title, details, badge, unavailable) {
      return `<article class="relative min-w-0 overflow-hidden rounded-md border bg-card px-5 py-5 shadow-sm">
        <div class="absolute inset-x-0 top-0 h-0.5 ${unavailable ? 'bg-red-500' : 'bg-emerald-500'}"></div>
        <div class="flex items-start justify-between gap-3">
          <span class="inline-flex size-8 shrink-0 items-center justify-center rounded-md bg-muted font-mono text-[11px] font-semibold text-muted-foreground">${marker}</span>
          <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium ${unavailable ? 'bg-red-500/10 text-red-600 dark:text-red-400' : 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-400'}">${badge}</span>
        </div>
        <p class="mt-5 text-[11px] font-medium uppercase tracking-widest text-muted-foreground">${label}</p>
        <h3 class="mt-1.5 min-w-0 break-words text-sm font-semibold leading-5">${title}</h3>
        <dl class="mt-4 text-sm">${details}</dl>
      </article>`;
    }

    function detail(label, value, mono = false) {
      return `<div class="grid min-w-0 grid-cols-[minmax(0,1fr)_minmax(0,1.35fr)] gap-3 border-t py-2.5 first:border-t-0 first:pt-0 last:pb-0"><dt class="text-muted-foreground">${label}</dt><dd class="min-w-0 break-words text-right font-medium ${mono ? 'font-mono text-xs leading-5' : ''}">${value}</dd></div>`;
    }

    function compactID(value) {
      const text = String(value || 'Unavailable');
      const short = text.length > 20 ? `${text.slice(0, 8)}…${text.slice(-6)}` : text;
      return `<span title="${escapeHTML(text)}">${escapeHTML(short)}</span>`;
    }

    function renderTopology(topology) {
      const grid = document.getElementById('topology-grid');
      const updated = document.getElementById('topology-updated');
      if (!topology) {
        grid.innerHTML = node('AP', 'Serving task', 'Runtime metadata unavailable', '', 'Retrying', true);
        updated.innerHTML = '<span class="size-1.5 rounded-full bg-red-500"></span>Retrying next refresh';
        return;
      }
      const app = topology.application || {};
      const compute = topology.compute || {};
      const db = topology.database || {};
      const appDetails = [
        detail('Region', escapeHTML(app.region)),
        detail('Availability zone', escapeHTML(app.availability_zone)),
        detail('Task ID', compactID(app.task_id), true),
        detail('Revision', escapeHTML(app.revision)),
      ].join('');
      const taskIDs = Array.isArray(compute.task_ids) && compute.task_ids.length ? compute.task_ids.map(id => `<span class="block">${compactID(id)}</span>`).join('') : 'None reported';
      const zones = Array.isArray(compute.availability_zones) && compute.availability_zones.length ? compute.availability_zones.map(escapeHTML).join(', ') : 'None reported';
      const computeDetails = [
        detail('Region', escapeHTML(compute.region)),
        detail('Tasks', `${Number(compute.running_count || 0)} / ${Number(compute.desired_count || 0)} running`),
        detail('Availability zones', zones),
        detail('Task IDs', taskIDs, true),
      ].join('');
      const dbDetails = [
        detail('Region', escapeHTML(db.region)),
        detail('Writer zone', escapeHTML(db.availability_zone)),
        detail('Managed standby', escapeHTML(db.secondary_availability_zone || 'Not reported')),
        detail('Status', escapeHTML(db.status)),
      ].join('');
      const computeReady = compute.available && compute.desired_count > 0 && compute.running_count === compute.desired_count && compute.multi_az;
      grid.innerHTML = node('AP', 'Serving task', escapeHTML(app.task_definition || 'Local development'), appDetails, escapeHTML(app.launch_type || 'local'), false)
        + node('ECS', 'Compute spread', escapeHTML(compute.name), computeDetails, computeReady ? 'HA ready' : 'Degraded', !computeReady)
        + node('DB', 'Data authority', escapeHTML(db.identifier), dbDetails, escapeHTML(db.available ? db.role : 'unavailable'), !db.available);
      updated.innerHTML = '<span class="size-1.5 rounded-full bg-emerald-500"></span>Live infrastructure data';
    }

    function timeAgo(t) {
      const s = Math.floor((Date.now() - new Date(t).getTime()) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      return Math.floor(m / 60) + 'h ago';
    }

    function renderBars(checks) {
      const slice = checks.slice(0, BAR_COUNT).reverse();
      const width = 6, gap = 1, height = 30;
      const total = slice.length * (width + gap) - gap;
      const bars = slice.map((check, index) => {
        const x = index * (width + gap);
        const color = check.is_up ? '#10b981' : '#ef4444';
        const label = check.is_up ? `Up ${check.response_ms}ms` : 'Down';
        return `<rect x="${x}" y="0" width="${width}" height="${height}" rx="2" fill="${color}" opacity="${check.is_up ? '0.85' : '1'}"><title>${label}</title></rect>`;
      }).join('');
      return `<svg width="${total}" height="${height}" viewBox="0 0 ${total} ${height}" aria-label="Recent availability" class="mt-1"><rect x="0" y="0" width="${total}" height="${height}" rx="3" fill="none" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="2 2"/>${bars}</svg>`;
    }

    function renderCards(statuses) {
      const container = document.getElementById('cards');
      if (!statuses || statuses.length === 0) {
        container.innerHTML = '<div class="rounded-lg border bg-card px-5 py-10 text-center text-sm text-muted-foreground">Waiting for first check results.</div>';
        return;
      }
      let allUp = true;
      container.innerHTML = statuses.map(status => {
        if (!status.is_up) allUp = false;
        const host = hostname(status.url);
        return `<article class="rounded-lg border bg-card px-5 py-4" id="card-${CSS.escape(host)}">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div class="flex min-w-0 items-center gap-3"><span class="size-2.5 shrink-0 rounded-full ${status.is_up ? 'bg-emerald-500' : 'bg-red-500'}"></span><h3 class="truncate text-sm font-semibold">${escapeHTML(host)}</h3></div>
            <span class="text-xs text-muted-foreground">${timeAgo(status.last_checked)}</span>
          </div>
          <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-muted-foreground">
            <span><strong class="font-medium text-foreground">${status.response_ms}ms</strong> response</span>
            <span><strong class="font-medium text-foreground">${status.uptime_pct_24h}%</strong> uptime, 24h</span>
            <div class="ml-auto" id="bars-${CSS.escape(host)}"></div>
          </div>
          <div class="chart-container mt-4" id="chart-${CSS.escape(host)}"></div>
        </article>`;
      }).join('');

      const banner = document.getElementById('banner');
      banner.className = `mb-6 flex items-center gap-3 rounded-lg border px-4 py-3 text-sm font-medium ${allUp ? 'border-emerald-500/20 bg-emerald-500/10 text-emerald-700 dark:text-emerald-400' : 'border-red-500/20 bg-red-500/10 text-red-700 dark:text-red-400'}`;
      banner.innerHTML = `<span class="size-2 shrink-0 rounded-full ${allUp ? 'bg-emerald-500' : 'bg-red-500'}"></span>${allUp ? 'All systems operational' : 'Service disruption detected'}`;
    }

    function renderHistoryChart(host, checks) {
      if (!checks || checks.length < 2) return;
      const container = document.getElementById('chart-' + CSS.escape(host));
      if (!container) return;
      const values = checks.slice().reverse();
      const times = values.map(check => new Date(check.checked_at).getTime() / 1000);
      const dark = document.documentElement.classList.contains('dark');
      const downBands = [];
      let bandStart = null;
      for (let i = 0; i < values.length; i++) {
        if (!values[i].is_up && bandStart === null) bandStart = times[i];
        if ((values[i].is_up || i === values.length - 1) && bandStart !== null) {
          downBands.push([bandStart, times[i]]);
          bandStart = null;
        }
      }
      const bands = downBands.map(b => {
        return { series: 2, fill: dark ? 'rgba(239,68,68,.22)' : 'rgba(239,68,68,.15)' };
      });
      const opts = {
        width: container.clientWidth || 600,
        height: 84,
        cursor: { show: false },
        select: { show: false },
        legend: { show: false },
        axes: [{ show: false }, { show: false }],
        series: [
          {},
          { stroke: '#10b981', width: 1.5, fill: dark ? 'rgba(16,185,129,.12)' : 'rgba(16,185,129,.08)', points: { show: false }, label: 'Response ms' },
          { stroke: 'transparent', fill: 'transparent', points: { show: false }, label: 'Status' },
        ],
        bands: bands,
      };
      new uPlot(opts, [times, values.map(check => check.response_ms || 0), values.map(check => check.is_up ? 1 : 0)], container);
    }

    async function fetchChecks() {
      try {
        const [statuses, topology] = await Promise.all([
          fetch('/status').then(response => response.json()),
          fetch('/topology').then(response => response.ok ? response.json() : null),
        ]);
        renderCards(statuses);
        renderTopology(topology);
        const historyEntries = await Promise.all(statuses.map(status => fetch(`/history?target=${encodeURIComponent(status.url)}&limit=100`).then(response => response.json()).then(checks => [hostname(status.url), checks])));
        for (const [host, checks] of historyEntries) {
          const bars = document.getElementById('bars-' + CSS.escape(host));
          if (bars) bars.innerHTML = renderBars(checks);
          renderHistoryChart(host, checks);
        }
      } catch (error) {
        renderTopology(null);
        document.getElementById('cards').innerHTML = '<div class="rounded-lg border border-red-500/20 bg-red-500/10 px-5 py-10 text-center text-sm text-red-700 dark:text-red-400">Unable to fetch status. Retrying.</div>';
      }
    }

    fetchChecks();
    setInterval(fetchChecks, REFRESH_MS);
  </script>
</body>
</html>
