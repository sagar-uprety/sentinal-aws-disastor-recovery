services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CHECK_INTERVAL_SECONDS: "30"
      MONITORED_URL: http://workload:8080/healthz
      PORT: "8080"
      # Real ECS/RDS topology can't exist locally; replay a fixture instead.
      # Never set outside this file, so deployed environments always use live AWS data.
      TOPOLOGY_MOCK_FILE: /testdata/topology.local.json
    volumes:
      - ./app/testdata:/testdata:ro
    depends_on:
      workload:
        condition: service_started

  workload-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${WORKLOAD_POSTGRES_PASSWORD:-shortener-local}
      POSTGRES_DB: shortener
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 2s
      timeout: 2s
      retries: 10

  workload:
    build:
      context: ./workload
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://shortener:${WORKLOAD_POSTGRES_PASSWORD:-shortener-local}@workload-db:5432/shortener?sslmode=disable
      LINK_CREATE_TOKEN: ${LINK_CREATE_TOKEN:-local-operator-token}
      PORT: "8080"
    depends_on:
      workload-db:
        condition: service_healthy
