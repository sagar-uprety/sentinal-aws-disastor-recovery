services:
  sentry:
    build:
      context: ./apps/sentry
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CHECK_INTERVAL_SECONDS: "30"
      MONITORED_URL: http://shortener:8080/healthz
      PORT: "8080"
      # Local Docker runs cannot reach real AWS ECS/RDS resources, so we use mock data here.
      # Production and secondary deployments should load live AWS topology from environment variables instead.
      TOPOLOGY_MOCK_FILE: /testdata/topology.local.json
    volumes:
      - ./apps/sentry/testdata:/testdata:ro
    depends_on:
      shortener:
        condition: service_started

  shortener-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${WORKLOAD_POSTGRES_PASSWORD:-shortener-local}
      POSTGRES_DB: shortener
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 2s
      timeout: 2s
      retries: 10

  shortener:
    build:
      context: ./apps/url-shortener
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://shortener:${WORKLOAD_POSTGRES_PASSWORD:-shortener-local}@shortener-db:5432/shortener?sslmode=disable
      LINK_CREATE_TOKEN: ${LINK_CREATE_TOKEN:-local-operator-token}
      PORT: "8080"
    depends_on:
      shortener-db:
        condition: service_healthy
