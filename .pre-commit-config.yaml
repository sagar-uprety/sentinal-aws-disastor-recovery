repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=false
          - --hook-config=--sort-by required
          - --hook-config=--hide-empty=true

  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.6
    hooks:
      - id: checkov
        args:
          - --quiet
          - --compact
          - --skip-check=CKV_AWS_219
          # NAT Gateway EIPs are attached via aws_nat_gateway's dynamic allocation_ids
          # block; checkov's static graph doesn't trace that association and always
          # flags them as unattached (per-resource skip comments don't propagate
          # through count-indexed resources).
          - --skip-check=CKV2_AWS_19
          - --skip-check=CKV_AWS_260
          - --skip-check=CKV_AWS_2
          - --skip-check=CKV2_AWS_20
          - --skip-check=CKV_AWS_103
          - --skip-check=CKV2_AWS_28
          - --skip-check=CKV_AWS_378
          # RDS Multi-AZ roughly doubles instance cost; toggle var.multi_az instead of
          # forcing it on. Revisit as a deliberate cost decision.
          - --skip-check=CKV_AWS_157
          # Workflow dispatch inputs are constrained to choices and an exact
          # destroy confirmation. This exception preserves operator gating.
          - --skip-check=CKV_GHA_7

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint-full
        entry: bash -c 'cd app && golangci-lint run --fix --config=../.golangci.yml'
      - id: golangci-lint-full
        name: golangci-lint workload
        entry: bash -c 'cd workload && golangci-lint run --fix --config=../.golangci.yml'

  - repo: local
    hooks:
      - id: go-fmt
        name: gofmt
        description: Format Go code
        entry: gofmt -s -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        description: Static analysis for Go
        entry: bash -c 'cd app && go vet ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: workload-go-vet
        name: workload go vet
        entry: bash -c 'cd workload && go vet ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go test
        description: Run Go tests
        entry: bash -c 'cd app && go test ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: workload-go-test
        name: workload go test
        entry: bash -c 'cd workload && go test ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-race
        name: go test -race
        description: Race detection
        entry: bash -c 'cd app && go test -race ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: workload-go-race
        name: workload go test -race
        entry: bash -c 'cd workload && go test -race ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        description: Clean up go.mod/go.sum
        entry: bash -c 'cd app && go mod tidy'
        language: system
        files: go\.mod$
        pass_filenames: false
      - id: workload-go-mod-tidy
        name: workload go mod tidy
        entry: bash -c 'cd workload && go mod tidy'
        language: system
        files: ^workload/go\.mod$
        pass_filenames: false
      - id: govulncheck
        name: govulncheck
        description: Check for known vulnerabilities
        entry: bash -c 'cd app && govulncheck ./...'
        language: system
        types: [go]
        pass_filenames: false
      - id: workload-govulncheck
        name: workload govulncheck
        entry: bash -c 'cd workload && govulncheck ./...'
        language: system
        types: [go]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: infracost-scan
        name: Infracost scan
        description: Check terraform infrastructure cost
        entry: bash -o pipefail -c 'infracost scan terraform/ --currency EUR 2>&1 | awk "/Monthly cost:/"'
        language: system
        pass_filenames: false
        always_run: false
        files: \.(tf|tfvars)$
        stages: [manual]
        verbose: true
