name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      operation:
        description: Speculative plan, apply, or guarded destroy of every environment.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      target:
        description: >-
          Root module to act on. Environments apply one per run, in order monitoring, primary, secondary,
          arc. arc needs both ALBs to exist, so it only applies after primary and secondary do.
          Ignored by destroy, which always runs arc, secondary, primary, monitoring.
        required: true
        default: primary
        type: choice
        options:
          - primary
          - secondary
          - monitoring
          - arc
      confirm_destroy:
        description: Type DESTROY to authorize a destroy operation.
        required: false
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  detect-changes:
    name: Detect Terraform plan targets
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan_targets: ${{ steps.plan_targets.outputs.targets }}
    steps:
      - name: Check out repository history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed Terraform roots
        if: github.event_name == 'pull_request'
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- terraform)
          targets="$(scripts/ci/terraform-plan-targets.sh "${changed_files[@]}")"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - name: Select Terraform plan targets
        id: plan_targets
        env:
          CHANGED_TARGETS: ${{ steps.paths.outputs.targets }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "targets=${CHANGED_TARGETS:-[]}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'targets=["%s"]\n' "$REQUESTED_TARGET" >> "$GITHUB_OUTPUT"
          else
            echo 'targets=[]' >> "$GITHUB_OUTPUT"
          fi

  preview:
    name: Speculative plan ${{ matrix.target }}
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'workflow_dispatch' && inputs.operation == 'plan') &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.plan_targets != '[]'
    runs-on: ubuntu-latest
    # Covers a typical same-env apply holding the state lock, plus the plan itself.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-changes.outputs.plan_targets) }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_TARGET: ${{ matrix.target }}
      TF_ROOT: terraform/environments/${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        uses: ./.github/actions/load-config
        with:
          target: ${{ matrix.target }}

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          session-name: terraform-preview-${{ github.run_id }}

      - name: Initialize remote state
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Create speculative plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          # Each environment has separate state, so these locks still allow matrix plans to run together.
          # Lock-timeout so a plan waits out a same-env apply instead of failing on lock contention.
          terraform plan -input=false -lock-timeout=30m -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload human-readable plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-preview-${{ env.TF_TARGET }}
          path: ${{ env.TF_ROOT }}/plan.txt
          retention-days: 7

  plan:
    name: Deployment plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'apply' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      TF_TARGET: ${{ inputs.target }}
      TF_ROOT: terraform/environments/${{ inputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        uses: ./.github/actions/load-config
        with:
          target: ${{ inputs.target }}

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          session-name: terraform-plan-${{ github.run_id }}

      # Both environments that publish public hostnames depend on apex delegation resolving.
      - name: Verify public Route 53 delegation
        if: inputs.target != 'secondary'
        run: scripts/ci/guard-topology.sh route53-delegation

      - name: Refuse apply during failback topology
        if: inputs.target == 'primary' || inputs.target == 'secondary'
        run: scripts/ci/guard-topology.sh no-failback

      - name: Initialize state
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # Saved so the approver reviews these exact bytes, and apply runs them as-is instead of re-planning.
      - name: Save plan for apply
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ inputs.target }}-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'apply' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Run one at a time: primary/secondary share ECS resources with ecs-url-shortener.yml,
    # and monitoring shares its ECS service and image-digest parameter with ecs-sentry.yml.
    concurrency:
      group: terraform-operations
      cancel-in-progress: false
    environment:
      name: terraform-production
      # secondary never serves public traffic (pilot light), so it gets no URL rather than a wrong one.
      url: ${{ inputs.target == 'monitoring' && steps.config.outputs.sentry_url || inputs.target == 'primary' && steps.config.outputs.workload_url || '' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      TF_TARGET: ${{ inputs.target }}
      TF_ROOT: terraform/environments/${{ inputs.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        id: config
        uses: ./.github/actions/load-config
        with:
          target: ${{ inputs.target }}

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          session-name: terraform-apply-${{ github.run_id }}

      # Topology can drift between plan and apply, including during the approval wait.
      - name: Refuse apply during failback topology
        if: inputs.target == 'primary' || inputs.target == 'secondary'
        run: scripts/ci/guard-topology.sh no-failback

      - name: Initialize state
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Download approved plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-${{ inputs.target }}-${{ github.run_id }}
          path: ${{ env.TF_ROOT }}

      - name: Show and apply approved plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform show -no-color tfplan
          terraform apply -input=false -lock-timeout=5m tfplan

      - name: Verify secondary pilot-light state
        if: inputs.target == 'secondary'
        run: scripts/ci/guard-topology.sh secondary-pilot-light

      # deploy_service now lives in terraform.tfvars, not a workflow input; read back what was actually applied.
      - name: Read deployed service flag
        id: deploy_service
        if: inputs.target == 'primary' || inputs.target == 'monitoring'
        working-directory: ${{ env.TF_ROOT }}
        run: echo "value=$(terraform output -raw deploy_service)" >> "$GITHUB_OUTPUT"

      - name: Verify isolated sentry
        if: inputs.target == 'monitoring' && steps.deploy_service.outputs.value == 'true'
        run: |
          aws ecs wait services-stable --region "$SENTRY_REGION" \
            --cluster "$PROJECT_NAME-monitoring" --services "$PROJECT_NAME-monitoring"
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors \
            "$SENTRY_URL/healthz"

      - name: Verify public workload health
        if: inputs.target == 'primary' && steps.deploy_service.outputs.value == 'true'
        run: |
          aws ecs wait services-stable --region "$PRIMARY_REGION" \
            --cluster "$PROJECT_NAME-primary" --services "$PROJECT_NAME-primary"
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors \
            "$WORKLOAD_URL/healthz"

  destroy:
    name: Destroy all environments (arc, secondary, primary, monitoring)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'destroy' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Destroy removes primary, secondary, and monitoring resources, so it must not overlap
    # recovery or either ECS deployment workflow.
    concurrency:
      group: terraform-operations
      cancel-in-progress: false
    environment: terraform-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate destroy confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM_DESTROY" != "DESTROY" ]; then
            echo "Destroy requires confirm_destroy=DESTROY." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        uses: ./.github/actions/load-config

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-destroy-${{ github.run_id }}

      - name: Refuse destruction during reverse replication
        run: scripts/ci/guard-topology.sh no-reverse-replication

      # arc first: its data sources read both ALBs unconditionally, so they'd fail to
      # refresh once either is gone. secondary before primary because the secondary database
      # replicates from primary, and primary before monitoring because monitoring only observes
      # the other two.
      - name: Destroy arc, secondary, then primary
        run: |
          for root in terraform/environments/arc terraform/environments/secondary terraform/environments/primary; do
            terraform -chdir="$root" init -input=false
            terraform -chdir="$root" plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan
            terraform -chdir="$root" show -no-color destroy.tfplan
            terraform -chdir="$root" apply -input=false -lock-timeout=5m destroy.tfplan
          done

      - name: Remove AWS-managed workload artifacts
        env:
          CONFIRM_CLEANUP: "YES"
        run: bash scripts/ci/cleanup-workload-artifacts.sh

      - name: Configure AWS credentials for monitoring
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: terraform-destroy-sentry-${{ github.run_id }}
          aws-region: ${{ env.SENTRY_REGION }}

      - name: Destroy monitoring
        working-directory: terraform/environments/monitoring
        run: |
          terraform init -input=false
          terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan
          terraform show -no-color destroy.tfplan
          terraform apply -input=false -lock-timeout=5m destroy.tfplan
