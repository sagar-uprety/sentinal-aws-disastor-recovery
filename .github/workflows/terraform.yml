name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - "terraform/**"
      - "scripts/ci/guard-topology.sh"
      - ".github/workflows/recovery.yml"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/ci/guard-topology.sh"
      - ".github/workflows/recovery.yml"
      - ".github/workflows/terraform.yml"
      - ".tflint.hcl"
  workflow_dispatch:
    inputs:
      operation:
        description: Speculative plan, apply, or guarded destroy of every environment.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      target:
        description: >-
          Root module to act on. Environments apply one per run, in order monitoring, prod, dr.
          Ignored by destroy, which always runs dr, prod, monitoring.
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dr
          - monitoring
      deploy_service:
        description: >-
          Create the ECS service. Set false for the foundation phase that provisions the ECR
          repository before any image exists. Ignored by dr.
        required: false
        default: true
        type: boolean
      create_arc:
        description: >-
          Provision (true) or tear down (false) the DR root's ARC cluster and controls.
          Applies only to target=dr.
        required: false
        default: false
        type: boolean
      confirm_destroy:
        description: Type DESTROY to authorize a destroy operation.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # apply/destroy share the account-wide "terraform-operations" lock with recovery.yml,
  # ecs-monitor.yml, ecs-url-shortener.yml (same live AWS resources). Everything else (PR,
  # push, manual plan) gets its own per-branch lock, so a plan never waits behind someone
  # else's live apply.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && inputs.operation != 'plan')
        && 'terraform-operations' || format('terraform-{0}', github.ref) }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
  MONITOR_URL: ${{ vars.MONITOR_URL }}
  WORKLOAD_URL: ${{ vars.WORKLOAD_URL }}
  PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
  DR_REGION: ${{ vars.DR_REGION }}
  MONITOR_REGION: ${{ vars.MONITOR_REGION }}

jobs:
  quality:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate root modules without remote state
        run: |
          roots=(
            terraform/environments/bootstrap
            terraform/environments/monitoring
            terraform/environments/prod
            terraform/environments/dr
          )
          for root in "${roots[@]}"; do
            data_dir="$RUNNER_TEMP/tf-data-${root##*/}"
            TF_DATA_DIR="$data_dir" terraform -chdir="$root" init -backend=false -input=false
            TF_DATA_DIR="$data_dir" terraform -chdir="$root" validate
          done

      - name: Run TFLint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl" --chdir=terraform

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          quiet: true
          compact: true
          config_file: .checkov.yaml

      # -x plus SCRIPTDIR resolves the drill-lib.sh/config.sh the other scripts source.
      - name: Run ShellCheck
        run: shellcheck -x --source-path=SCRIPTDIR scripts/*.sh scripts/ci/*.sh scripts/drills/*.sh

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          installer_url="https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}"
          installer_url="${installer_url}/scripts/download-actionlint.bash"
          bash <(curl --fail --silent --show-error --location "$installer_url") "$ACTIONLINT_VERSION"
          ./actionlint -color

      - name: Validate destructive-operation confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'destroy'
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM_DESTROY" != "DESTROY" ]; then
            echo "Destroy requires confirm_destroy=DESTROY." >&2
            exit 1
          fi

  plan:
    name: Plan ${{ inputs.target || 'prod' }}
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.operation == 'plan' ||
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_TARGET: ${{ inputs.target || 'prod' }}
      TF_ROOT: terraform/environments/${{ inputs.target || 'prod' }}
      TF_REGION: ${{ fromJSON(vars.TF_REGION_MAP)[inputs.target || 'prod'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-arn: ${{ github.event_name == 'pull_request' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.TF_REGION }}
          session-name: terraform-plan-${{ github.run_id }}

      - name: Initialize remote state
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Create speculative plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          DEPLOY_SERVICE: ${{ inputs.deploy_service }}
          CREATE_ARC: ${{ inputs.create_arc }}
        run: |
          # shellcheck source=../../../scripts/ci/terraform-plan-vars.sh
          source "$GITHUB_WORKSPACE/scripts/ci/terraform-plan-vars.sh"
          build_plan_args
          # Skip requesting the state lock: a plan is read-only, but still asks for the lock by
          # default, so it could sit blocked for up to 5m behind an unrelated apply in progress.
          [ "$IS_PULL_REQUEST" = "true" ] && plan_args+=("-lock=false")
          terraform plan -input=false -lock-timeout=5m -out=tfplan "${plan_args[@]}"
          terraform show -no-color tfplan > plan.txt

      - name: Upload human-readable plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ env.TF_TARGET }}
          path: ${{ env.TF_ROOT }}/plan.txt
          retention-days: 7

      # No PR comment bot: the plan job shows as a check on the PR, and its "Details"
      # link opens straight to this run summary.
      - name: Publish plan summary
        env:
          PLAN_FILE: ${{ env.TF_ROOT }}/plan.txt
        run: |
          {
            echo "## Terraform speculative plan ($TF_TARGET)"
            echo
            echo '```terraform'
            tail -c 60000 "$PLAN_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply ${{ inputs.target }}
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'apply' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: terraform-production
      # dr never serves public traffic (pilot light), so it gets no URL rather than a wrong one.
      url: ${{ inputs.target == 'monitoring' && vars.MONITOR_URL || inputs.target == 'prod' && vars.WORKLOAD_URL || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_TARGET: ${{ inputs.target }}
      TF_ROOT: terraform/environments/${{ inputs.target }}
      TF_REGION: ${{ fromJSON(vars.TF_REGION_MAP)[inputs.target] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.TF_REGION }}
          session-name: terraform-apply-${{ github.run_id }}

      # Both environments that publish public hostnames depend on apex delegation resolving.
      - name: Verify public Route 53 delegation
        if: inputs.target != 'dr'
        run: scripts/ci/guard-topology.sh route53-delegation

      - name: Refuse apply during failback topology
        if: inputs.target == 'prod' || inputs.target == 'dr'
        run: scripts/ci/guard-topology.sh no-failback

      - name: Initialize state
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          DEPLOY_SERVICE: ${{ inputs.deploy_service }}
          CREATE_ARC: ${{ inputs.create_arc }}
        run: |
          # shellcheck source=../../../scripts/ci/terraform-plan-vars.sh
          source "$GITHUB_WORKSPACE/scripts/ci/terraform-plan-vars.sh"
          build_plan_args
          terraform plan -input=false -lock-timeout=5m -out=tfplan "${plan_args[@]}"

      - name: Show plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform show -no-color tfplan

      - name: Apply plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Verify DR pilot-light state
        if: inputs.target == 'dr'
        run: scripts/ci/guard-topology.sh dr-pilot-light

      - name: Verify isolated monitor
        if: inputs.target == 'monitoring' && inputs.deploy_service
        run: |
          aws ecs wait services-stable --region "$MONITOR_REGION" \
            --cluster "$PROJECT_NAME-monitoring" --services "$PROJECT_NAME-monitoring"
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors \
            "$MONITOR_URL/healthz"

      - name: Verify public workload health
        if: inputs.target == 'prod' && inputs.deploy_service
        run: |
          aws ecs wait services-stable --region "$PRIMARY_REGION" \
            --cluster "$PROJECT_NAME-prod" --services "$PROJECT_NAME-prod"
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors \
            "$WORKLOAD_URL/healthz"

  destroy:
    name: Destroy all environments (dr, prod, monitoring)
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'destroy' &&
      inputs.confirm_destroy == 'DESTROY' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: terraform-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-destroy-${{ github.run_id }}

      - name: Refuse destruction during reverse replication
        run: scripts/ci/guard-topology.sh no-reverse-replication

      # dr before prod because the DR database replicates from prod, and prod before
      # monitoring because monitoring only observes the other two.
      - name: Destroy dr then prod
        run: |
          for root in terraform/environments/dr terraform/environments/prod; do
            terraform -chdir="$root" init -input=false
            terraform -chdir="$root" plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan
            terraform -chdir="$root" show -no-color destroy.tfplan
            terraform -chdir="$root" apply -input=false -lock-timeout=5m destroy.tfplan
          done

      - name: Remove AWS-managed workload artifacts
        env:
          CONFIRM_CLEANUP: "YES"
        run: bash scripts/ci/cleanup-workload-artifacts.sh

      - name: Configure AWS credentials for monitoring
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: terraform-destroy-monitor-${{ github.run_id }}
          aws-region: ${{ env.MONITOR_REGION }}

      - name: Destroy monitoring
        working-directory: terraform/environments/monitoring
        run: |
          terraform init -input=false
          terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan
          terraform show -no-color destroy.tfplan
          terraform apply -input=false -lock-timeout=5m destroy.tfplan
