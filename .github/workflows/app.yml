name: Application CI/CD

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Publish image only during initial infrastructure bootstrap, or deploy it to both regions.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - publish-only

permissions:
  contents: read

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-central-1
  DR_AWS_REGION: eu-west-1
  DR_ECS_CLUSTER: sentinel-aws-dr-dr
  DR_ECS_SERVICE: sentinel-aws-dr-dr
  ECR_REPOSITORY: sentinel-aws-dr-prod
  ECS_CLUSTER: sentinel-aws-dr-prod
  ECS_SERVICE: sentinel-aws-dr-prod
  CONTAINER_NAME: sentinel
  STATUS_URL: https://sentinel.sagaruprety.com.np

jobs:
  quality:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests with race detection
        run: go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 container image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

  deploy:
    name: Deploy application to production
    needs: quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ env.STATUS_URL }}
    concurrency:
      group: terraform-operations
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: app-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

      - name: Report published image digest
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          {
            echo "## Published application image"
            echo
            echo "\`$ECR_REPOSITORY@$IMAGE_DIGEST\`"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "publish-only" ]; then
              echo
              echo "Use \`$IMAGE_DIGEST\` as the Terraform deployment's \`image_digest\` input."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read current ECS task definition
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        run: >-
          aws ecs describe-task-definition
          --task-definition "$ECS_SERVICE"
          --query taskDefinition
          > task-definition.json

      - name: Render task definition with immutable image
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}

      - name: Deploy task definition to ECS
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15
          wait-max-delay-seconds: 15

      - name: Verify public application health
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors "$STATUS_URL/healthz"

      - name: Wait for image replication to DR
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          for _ in {1..60}; do
            if aws ecr describe-images \
              --region "$DR_AWS_REGION" \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageDigest="$IMAGE_DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "ECR image $IMAGE_DIGEST did not replicate to $DR_AWS_REGION within 10 minutes." >&2
          exit 1

      - name: Read current DR task definition
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        run: >-
          aws ecs describe-task-definition
          --region "$DR_AWS_REGION"
          --task-definition "$DR_ECS_SERVICE"
          --query taskDefinition
          > dr-task-definition.json

      - name: Resolve DR image URI
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        id: dr-image
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "uri=$account_id.dkr.ecr.$DR_AWS_REGION.amazonaws.com/$ECR_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Render DR task definition with immutable image
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        id: render-dr-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: dr-task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.dr-image.outputs.uri }}

      - name: Deploy task definition to DR pilot light
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        env:
          AWS_DEFAULT_REGION: ${{ env.DR_AWS_REGION }}
          AWS_REGION: ${{ env.DR_AWS_REGION }}
        with:
          task-definition: ${{ steps.render-dr-task-definition.outputs.task-definition }}
          cluster: ${{ env.DR_ECS_CLUSTER }}
          service: ${{ env.DR_ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 5
          wait-max-delay-seconds: 15

      - name: Verify DR pilot-light image
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          read -r desired task_definition <<<"$(aws ecs describe-services \
            --region "$DR_AWS_REGION" \
            --cluster "$DR_ECS_CLUSTER" \
            --services "$DR_ECS_SERVICE" \
            --query 'services[0].[desiredCount,taskDefinition]' --output text)"
          # JMESPath backticks are literals, not shell substitutions.
          # shellcheck disable=SC2016
          image="$(aws ecs describe-task-definition \
            --region "$DR_AWS_REGION" \
            --task-definition "$task_definition" \
            --query 'taskDefinition.containerDefinitions[?name==`sentinel`].image | [0]' --output text)"
          test "$desired" = "0"
          test "${image##*@}" = "$IMAGE_DIGEST"
