name: Workload CI/CD

on:
  pull_request:
    paths:
      - "apps/url-shortener/**"
      - ".github/workflows/workload.yml"
  push:
    branches: [main]
    paths:
      - "apps/url-shortener/**"
      - ".github/workflows/workload.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Publish only for initial infrastructure, or deploy the workload to prod and DR.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - publish-only

permissions:
  contents: read

concurrency:
  group: workload-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-central-1
  CONTAINER_NAME: shortener
  DR_AWS_REGION: eu-west-1
  DR_ECS_CLUSTER: pilotlight-dr
  DR_ECS_SERVICE: pilotlight-dr
  ECR_REPOSITORY: pilotlight-prod
  ECS_CLUSTER: pilotlight-prod
  ECS_SERVICE: pilotlight-prod
  WORKLOAD_URL: https://shortener.pilotlight.sagaruprety.com.np

jobs:
  quality:
    name: Test and build URL shortener
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/url-shortener
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener-test
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shortener:shortener-test@localhost:5432/shortener?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/url-shortener/go.mod
          cache-dependency-path: apps/url-shortener/go.sum

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests with race detection
        run: go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 container image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/url-shortener
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=shortener
          cache-to: type=gha,mode=max,scope=shortener

  deploy:
    name: Deploy URL-shortener workload
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ env.WORKLOAD_URL }}
    concurrency:
      group: terraform-operations
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: workload-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable workload image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/url-shortener
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=shortener
          cache-to: type=gha,mode=max,scope=shortener

      - name: Report workload image digest
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          echo "## Published workload image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ECR_REPOSITORY@$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Read current prod task definition
        if: inputs.mode == 'deploy'
        run: aws ecs describe-task-definition --task-definition "$ECS_SERVICE" --query taskDefinition > task-definition.json

      - name: Render prod task definition
        if: inputs.mode == 'deploy'
        id: render-prod
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}

      - name: Deploy prod workload
        if: inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-prod.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Verify public workload health
        if: inputs.mode == 'deploy'
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors "$WORKLOAD_URL/healthz"

      - name: Wait for image replication to DR
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          for _ in {1..60}; do
            if aws ecr describe-images --region "$DR_AWS_REGION" --repository-name "$ECR_REPOSITORY" --image-ids imageDigest="$IMAGE_DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "ECR image did not replicate to DR within 10 minutes." >&2
          exit 1

      - name: Read current DR task definition
        if: inputs.mode == 'deploy'
        run: aws ecs describe-task-definition --region "$DR_AWS_REGION" --task-definition "$DR_ECS_SERVICE" --query taskDefinition > dr-task-definition.json

      - name: Resolve DR image URI
        if: inputs.mode == 'deploy'
        id: dr-image
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "uri=$account_id.dkr.ecr.$DR_AWS_REGION.amazonaws.com/$ECR_REPOSITORY@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Render DR task definition
        if: inputs.mode == 'deploy'
        id: render-dr
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: dr-task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.dr-image.outputs.uri }}

      - name: Deploy DR pilot-light task definition
        if: inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        env:
          AWS_DEFAULT_REGION: ${{ env.DR_AWS_REGION }}
          AWS_REGION: ${{ env.DR_AWS_REGION }}
        with:
          task-definition: ${{ steps.render-dr.outputs.task-definition }}
          cluster: ${{ env.DR_ECS_CLUSTER }}
          service: ${{ env.DR_ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 5
