name: Disaster Recovery Reconciliation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Guarded failback topology operation.
        required: true
        type: choice
        options:
          - failback-prepare
          - failback-reset
          - credential-repair
      confirm_failback:
        description: Type REBUILD_PROD, RESET_DR, or RECONCILE_CREDENTIAL for the selected operation.
        required: true
        type: string
      failback_snapshot_id:
        description: Fresh encrypted DR-writer snapshot required by failback-prepare operations.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-operations
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
  PRIMARY_REGION: ${{ vars.PRIMARY_REGION }}
  DR_REGION: ${{ vars.DR_REGION }}

jobs:
  preflight:
    name: Validate recovery request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Each operation's job also gates on inputs.confirm_failback in its own `if:`, but a
      # mismatch there just skips the job (run still shows green). Failing here instead of
      # skipping silently.
      - name: Validate typed confirmation
        env:
          CONFIRM_FAILBACK: ${{ inputs.confirm_failback }}
          OPERATION: ${{ inputs.operation }}
          SNAPSHOT_ID: ${{ inputs.failback_snapshot_id }}
        run: |
          case "$OPERATION" in
            failback-prepare)
              expected=REBUILD_PROD
              test -n "$SNAPSHOT_ID" || {
                echo "failback-prepare requires failback_snapshot_id." >&2
                exit 1
              }
              ;;
            failback-reset) expected=RESET_DR ;;
            credential-repair) expected=RECONCILE_CREDENTIAL ;;
            *)
              echo "Unknown operation $OPERATION." >&2
              exit 1
              ;;
          esac
          if [ "$CONFIRM_FAILBACK" != "$expected" ]; then
            echo "$OPERATION requires confirm_failback=$expected." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate recovery root modules
        run: |
          for root in terraform/environments/prod terraform/environments/dr; do
            data_dir="$RUNNER_TEMP/recovery-${root##*/}"
            TF_DATA_DIR="$data_dir" terraform -chdir="$root" init -backend=false -input=false
            TF_DATA_DIR="$data_dir" terraform -chdir="$root" validate
          done

  failback-prepare-plan:
    name: Plan primary reverse replica
    needs: preflight
    if: >-
      inputs.operation == 'failback-prepare' && inputs.confirm_failback == 'REBUILD_PROD' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-prepare-plan-${{ github.run_id }}

      # -replace forces destroy-and-recreate unconditionally, so a second failback-prepare
      # run against an already-rebuilt prod replica would destroy it, not no-op.
      - name: Verify prod is not already a reverse replica
        run: scripts/ci/guard-topology.sh prod-standalone-writer

      - name: Verify safety snapshot and promoted DR writer
        env:
          SNAPSHOT_ID: ${{ inputs.failback_snapshot_id }}
        run: |
          scripts/ci/guard-topology.sh safety-snapshot "$SNAPSHOT_ID"
          echo "DR_SOURCE_ARN=$(scripts/ci/guard-topology.sh dr-writer-arn)" >> "$GITHUB_ENV"

      - name: Initialize primary state
        working-directory: terraform/environments/prod
        run: terraform init -input=false

      # The image digest comes from the SSM parameter ecs-url-shortener.yml publishes, so no
      # digest travels through this workflow as a variable.
      - name: Plan reverse replication to primary
        working-directory: terraform/environments/prod
        run: |
          terraform plan -input=false -lock-timeout=5m -out=failback-prepare.tfplan \
            -replace='module.rds.aws_db_instance.main' \
            -var='deploy_service=true' \
            -var='desired_count=0' \
            -var='multi_az=false' \
            -var="replicate_source_db_arn=$DR_SOURCE_ARN"

      - name: Show reverse-replication plan
        working-directory: terraform/environments/prod
        run: terraform show -no-color failback-prepare.tfplan

      - name: Save reverse-replication plan for approval
        uses: actions/upload-artifact@v7
        with:
          name: failback-prepare-plan-${{ github.run_id }}
          path: terraform/environments/prod/failback-prepare.tfplan
          retention-days: 1

  failback-prepare-apply:
    name: Apply primary reverse replica
    needs: failback-prepare-plan
    if: >-
      inputs.operation == 'failback-prepare' && inputs.confirm_failback == 'REBUILD_PROD' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-prepare-apply-${{ github.run_id }}

      # Re-run after the approval gate, since the topology can drift while a human decides.
      - name: Recheck safety snapshot
        env:
          SNAPSHOT_ID: ${{ inputs.failback_snapshot_id }}
        run: scripts/ci/guard-topology.sh safety-snapshot "$SNAPSHOT_ID"

      - name: Initialize primary state
        working-directory: terraform/environments/prod
        run: terraform init -input=false

      - name: Download approved reverse-replication plan
        uses: actions/download-artifact@v8
        with:
          name: failback-prepare-plan-${{ github.run_id }}
          path: terraform/environments/prod

      - name: Show and apply approved reverse-replication plan
        working-directory: terraform/environments/prod
        run: |
          terraform show -no-color failback-prepare.tfplan
          terraform apply -input=false -lock-timeout=5m failback-prepare.tfplan

      - name: Verify primary reverse replica
        run: |
          aws rds wait db-instance-available --region "$PRIMARY_REGION" --db-instance-identifier "$PROJECT_NAME-prod"
          source="$(aws rds describe-db-instances --region "$PRIMARY_REGION" \
            --db-instance-identifier "$PROJECT_NAME-prod" \
            --query 'DBInstances[0].ReadReplicaSourceDBInstanceIdentifier' --output text)"
          desired="$(aws ecs describe-services --region "$PRIMARY_REGION" \
            --cluster "$PROJECT_NAME-prod" --services "$PROJECT_NAME-prod" \
            --query 'services[0].desiredCount' --output text)"
          [[ "$source" == *"$PROJECT_NAME-dr"* ]] || {
            echo "Prod replicates from $source, expected the DR writer." >&2
            exit 1
          }
          test "$desired" = "0"

  failback-reset-plan:
    name: Plan primary-to-DR pilot-light restoration
    needs: preflight
    if: inputs.operation == 'failback-reset' && inputs.confirm_failback == 'RESET_DR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-reset-plan-${{ github.run_id }}

      - name: Verify traffic and primary readiness
        run: scripts/ci/guard-topology.sh prod-serving-traffic

      - name: Plan primary reconciliation
        working-directory: terraform/environments/prod
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=5m -out=failback-primary.tfplan \
            -var='deploy_service=true' \
            -var='desired_count=2' \
            -var='multi_az=true'
          terraform show -no-color failback-primary.tfplan

      - name: Plan DR pilot-light restoration
        working-directory: terraform/environments/dr
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=5m -out=failback-dr.tfplan \
            -replace='module.rds.aws_db_instance.main' \
            -var='desired_count=0' \
            -var='multi_az=false'
          terraform show -no-color failback-dr.tfplan

      - name: Save primary reconciliation plan for approval
        uses: actions/upload-artifact@v7
        with:
          name: failback-primary-plan-${{ github.run_id }}
          path: terraform/environments/prod/failback-primary.tfplan
          retention-days: 1

      - name: Save DR restoration plan for approval
        uses: actions/upload-artifact@v7
        with:
          name: failback-dr-plan-${{ github.run_id }}
          path: terraform/environments/dr/failback-dr.tfplan
          retention-days: 1

  failback-reset-apply:
    name: Apply primary-to-DR pilot-light restoration
    needs: failback-reset-plan
    if: inputs.operation == 'failback-reset' && inputs.confirm_failback == 'RESET_DR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-reset-apply-${{ github.run_id }}

      # Re-run after the approval gate, since the topology can drift while a human decides.
      - name: Recheck primary traffic and readiness
        run: scripts/ci/guard-topology.sh prod-serving-traffic

      - name: Download approved primary plan
        uses: actions/download-artifact@v8
        with:
          name: failback-primary-plan-${{ github.run_id }}
          path: terraform/environments/prod

      - name: Download approved DR plan
        uses: actions/download-artifact@v8
        with:
          name: failback-dr-plan-${{ github.run_id }}
          path: terraform/environments/dr

      - name: Show and apply approved primary plan
        working-directory: terraform/environments/prod
        run: |
          terraform init -input=false
          terraform show -no-color failback-primary.tfplan
          terraform apply -input=false -lock-timeout=5m failback-primary.tfplan

      - name: Show and apply approved DR plan
        working-directory: terraform/environments/dr
        run: |
          terraform init -input=false
          terraform show -no-color failback-dr.tfplan
          terraform apply -input=false -lock-timeout=5m failback-dr.tfplan

      - name: Verify restored pilot light
        run: |
          aws rds wait db-instance-available --region "$DR_REGION" --db-instance-identifier "$PROJECT_NAME-dr"
          scripts/ci/guard-topology.sh dr-pilot-light

  credential-repair:
    name: Reconcile promoted-primary credential
    needs: preflight
    if: >-
      inputs.operation == 'credential-repair' && inputs.confirm_failback == 'RECONCILE_CREDENTIAL' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: terraform-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: credential-repair-${{ github.run_id }}
          aws-region: ${{ env.PRIMARY_REGION }}

      # A promoted replica keeps the password it inherited, so repair is only correct
      # once the topology is fully reset to prod-writer plus DR pilot light.
      - name: Verify reset topology before credential repair
        run: |
          scripts/ci/guard-topology.sh prod-multi-az-writer
          scripts/ci/guard-topology.sh dr-pilot-light

      - name: Reconcile RDS password from SecureString
        run: |
          db_password="$(aws ssm get-parameter --region "$PRIMARY_REGION" \
            --name "/$PROJECT_NAME/prod/database/password" --with-decryption \
            --query 'Parameter.Value' --output text)"
          trap 'unset db_password' EXIT
          aws rds modify-db-instance --region "$PRIMARY_REGION" \
            --db-instance-identifier "$PROJECT_NAME-prod" \
            --master-user-password "$db_password" --apply-immediately >/dev/null
          aws rds wait db-instance-available --region "$PRIMARY_REGION" \
            --db-instance-identifier "$PROJECT_NAME-prod"

      - name: Restart prod tasks with reconciled credential
        run: |
          aws ecs update-service --region "$PRIMARY_REGION" \
            --cluster "$PROJECT_NAME-prod" --service "$PROJECT_NAME-prod" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --region "$PRIMARY_REGION" \
            --cluster "$PROJECT_NAME-prod" --services "$PROJECT_NAME-prod"

      - name: Verify restored public health
        run: scripts/ci/guard-topology.sh wait-prod-recovered
