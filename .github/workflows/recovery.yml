name: Disaster Recovery Reconciliation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Guarded failback topology operation.
        required: true
        type: choice
        options:
          - failback-prepare
          - failback-reset
      confirm:
        description: Confirm you want to run the selected operation.
        required: true
        type: boolean
        default: false
      failback_snapshot_id:
        description: Fresh encrypted secondary-writer snapshot required by failback-prepare operations.
        required: false
        type: string

permissions:
  contents: read

# Recovery changes primary/secondary RDS topology, Terraform state, and ECS capacity;
# serialize it with normal Terraform operations and workload deployments.
concurrency:
  group: terraform-operations
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  preflight:
    name: Validate recovery request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Each operation's job also gates on inputs.confirm in its own `if:`, but a mismatch
      # there just skips the job (run still shows green). Failing here instead of skipping silently.
      - name: Validate confirmation and operation-specific inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          OPERATION: ${{ inputs.operation }}
          SNAPSHOT_ID: ${{ inputs.failback_snapshot_id }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "Check confirm to run $OPERATION." >&2
            exit 1
          fi
          if [ "$OPERATION" = "failback-prepare" ] && [ -z "$SNAPSHOT_ID" ]; then
            echo "failback-prepare requires failback_snapshot_id." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup

      - name: Validate recovery root modules
        run: |
          for root in terraform/environments/primary terraform/environments/secondary; do
            data_dir="$RUNNER_TEMP/recovery-${root##*/}"
            TF_DATA_DIR="$data_dir" terraform -chdir="$root" init -backend=false -input=false
            TF_DATA_DIR="$data_dir" terraform -chdir="$root" validate
          done

  failback-prepare-plan:
    name: Plan primary reverse replica
    needs: preflight
    if: >-
      inputs.operation == 'failback-prepare' && inputs.confirm == true &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        uses: ./.github/actions/load-config

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-prepare-plan-${{ github.run_id }}

      # -replace forces destroy-and-recreate unconditionally, so a second failback-prepare
      # run against an already-rebuilt primary replica would destroy it, not no-op.
      - name: Verify primary is not already a reverse replica
        run: scripts/ci/guard-topology.sh primary-standalone-writer

      - name: Verify safety snapshot and promoted secondary writer
        env:
          SNAPSHOT_ID: ${{ inputs.failback_snapshot_id }}
        run: |
          scripts/ci/guard-topology.sh safety-snapshot "$SNAPSHOT_ID"
          echo "SECONDARY_SOURCE_ARN=$(scripts/ci/guard-topology.sh secondary-writer-arn)" >> "$GITHUB_ENV"

      - name: Initialize primary state
        working-directory: terraform/environments/primary
        run: terraform init -input=false

      # The image digest comes from the SSM parameter ecs-url-shortener.yml publishes, so no
      # digest travels through this workflow as a variable.
      # desired_count=0 is required, not just tidy: the app runs CREATE TABLE IF NOT EXISTS on
      # boot, which a read-only replica rejects, so no task may start until cutover promotes it.
      - name: Plan reverse replication to primary
        working-directory: terraform/environments/primary
        run: |
          terraform plan -input=false -lock-timeout=5m -out=failback-prepare.tfplan \
            -replace='module.rds.aws_db_instance.main' \
            -var='deploy_service=true' \
            -var='desired_count=0' \
            -var='multi_az=false' \
            -var="replicate_source_db_arn=$SECONDARY_SOURCE_ARN"

      - name: Save reverse-replication plan for approval
        uses: actions/upload-artifact@v7
        with:
          name: failback-prepare-plan-${{ github.run_id }}
          path: terraform/environments/primary/failback-prepare.tfplan
          retention-days: 1

  failback-prepare-apply:
    name: Apply primary reverse replica
    needs: failback-prepare-plan
    if: >-
      inputs.operation == 'failback-prepare' && inputs.confirm == true &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        uses: ./.github/actions/load-config

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-prepare-apply-${{ github.run_id }}

      # Re-run after the approval gate, since the topology can drift while a human decides.
      - name: Recheck safety snapshot
        env:
          SNAPSHOT_ID: ${{ inputs.failback_snapshot_id }}
        run: scripts/ci/guard-topology.sh safety-snapshot "$SNAPSHOT_ID"

      - name: Initialize primary state
        working-directory: terraform/environments/primary
        run: terraform init -input=false

      - name: Download approved reverse-replication plan
        uses: actions/download-artifact@v8
        with:
          name: failback-prepare-plan-${{ github.run_id }}
          path: terraform/environments/primary

      - name: Show and apply approved reverse-replication plan
        working-directory: terraform/environments/primary
        run: |
          terraform show -no-color failback-prepare.tfplan
          terraform apply -input=false -lock-timeout=5m failback-prepare.tfplan

      - name: Verify primary reverse replica
        run: |
          aws rds wait db-instance-available --region "$PRIMARY_REGION" --db-instance-identifier "$PROJECT_NAME-primary"
          scripts/ci/guard-topology.sh primary-reverse-replica

  failback-reset-plan:
    name: Plan primary-to-secondary pilot-light restoration
    needs: preflight
    if: inputs.operation == 'failback-reset' && inputs.confirm == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        uses: ./.github/actions/load-config

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-reset-plan-${{ github.run_id }}

      - name: Verify traffic and primary readiness
        run: scripts/ci/guard-topology.sh primary-serving-traffic

      - name: Plan primary reconciliation
        working-directory: terraform/environments/primary
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=5m -out=failback-primary.tfplan \
            -var='deploy_service=true' \
            -var='desired_count=2' \
            -var='multi_az=true'

      - name: Plan secondary pilot-light restoration
        working-directory: terraform/environments/secondary
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=5m -out=failback-secondary.tfplan \
            -replace='module.rds.aws_db_instance.main' \
            -var='desired_count=0' \
            -var='multi_az=false'

      - name: Save primary reconciliation plan for approval
        uses: actions/upload-artifact@v7
        with:
          name: failback-primary-plan-${{ github.run_id }}
          path: terraform/environments/primary/failback-primary.tfplan
          retention-days: 1

      - name: Save secondary restoration plan for approval
        uses: actions/upload-artifact@v7
        with:
          name: failback-secondary-plan-${{ github.run_id }}
          path: terraform/environments/secondary/failback-secondary.tfplan
          retention-days: 1

  failback-reset-apply:
    name: Apply primary-to-secondary pilot-light restoration
    needs: failback-reset-plan
    if: inputs.operation == 'failback-reset' && inputs.confirm == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: terraform-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Load project configuration
        uses: ./.github/actions/load-config

      - name: Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          role-arn: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          session-name: terraform-failback-reset-apply-${{ github.run_id }}

      # Re-run after the approval gate, since the topology can drift while a human decides.
      - name: Recheck primary traffic and readiness
        run: scripts/ci/guard-topology.sh primary-serving-traffic

      - name: Download approved primary plan
        uses: actions/download-artifact@v8
        with:
          name: failback-primary-plan-${{ github.run_id }}
          path: terraform/environments/primary

      - name: Download approved secondary plan
        uses: actions/download-artifact@v8
        with:
          name: failback-secondary-plan-${{ github.run_id }}
          path: terraform/environments/secondary

      - name: Show and apply approved primary plan
        working-directory: terraform/environments/primary
        run: |
          terraform init -input=false
          terraform show -no-color failback-primary.tfplan
          terraform apply -input=false -lock-timeout=5m failback-primary.tfplan

      - name: Show and apply approved secondary plan
        working-directory: terraform/environments/secondary
        run: |
          terraform init -input=false
          terraform show -no-color failback-secondary.tfplan
          terraform apply -input=false -lock-timeout=5m failback-secondary.tfplan

      - name: Verify restored pilot light
        run: |
          aws rds wait db-instance-available --region "$SECONDARY_REGION" --db-instance-identifier "$PROJECT_NAME-secondary"
          scripts/ci/guard-topology.sh secondary-pilot-light
