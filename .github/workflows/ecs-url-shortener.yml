name: Workload CI/CD

on:
  pull_request:
    paths:
      - "apps/url-shortener/**"
      - ".github/workflows/ecs-url-shortener.yml"
  push:
    branches: [main]
    paths:
      - "apps/url-shortener/**"
      - ".github/workflows/ecs-url-shortener.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Publish only for initial infrastructure, or deploy the workload to primary and secondary.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - publish-only

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.PRIMARY_REGION }}
  CONTAINER_NAME: shortener
  SECONDARY_AWS_REGION: ${{ vars.SECONDARY_REGION }}
  SECONDARY_ECS_CLUSTER: ${{ vars.PROJECT_NAME }}-secondary
  SECONDARY_ECS_SERVICE: ${{ vars.PROJECT_NAME }}-secondary
  ECR_REPOSITORY: ${{ vars.PROJECT_NAME }}-primary
  ECS_CLUSTER: ${{ vars.PROJECT_NAME }}-primary
  ECS_SERVICE: ${{ vars.PROJECT_NAME }}-primary
  IMAGE_DIGEST_PARAMETER: /${{ vars.PROJECT_NAME }}/primary/image-digest
  WORKLOAD_URL: ${{ vars.WORKLOAD_URL }}

jobs:
  quality:
    name: Test and build URL shortener
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/url-shortener
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener-test
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shortener:shortener-test@localhost:5432/shortener?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/url-shortener/go.mod
          cache-dependency-path: apps/url-shortener/go.sum

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests with race detection
        run: go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 container image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/url-shortener
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=shortener
          cache-to: type=gha,mode=max,scope=shortener

  deploy:
    name: Deploy URL-shortener workload
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.WORKLOAD_URL }}
    # Updates the primary image-digest parameter and both primary/secondary ECS services,
    # which Terraform and recovery operations can also change or remove.
    concurrency:
      group: terraform-operations
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_WORKLOAD_ROLE_ARN }}
          role-session-name: workload-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable workload image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/url-shortener
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=shortener
          cache-to: type=gha,mode=max,scope=shortener

      # Terraform seeds this parameter with a placeholder on the first deploy_service=false
      # apply; overwriting it with a real digest here is what lets deploy_service=true pass.
      # publish-only has no deploy/health step to gate on, so it publishes immediately.
      - name: Publish workload image digest (publish-only)
        if: inputs.mode == 'publish-only'
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          aws ssm put-parameter --name "$IMAGE_DIGEST_PARAMETER" \
            --type String --value "$IMAGE_DIGEST" --overwrite >/dev/null
          echo "## Published workload image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ECR_REPOSITORY@$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Read current primary task definition
        if: inputs.mode == 'deploy'
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query taskDefinition > task-definition.json

      - name: Render primary task definition
        if: inputs.mode == 'deploy'
        id: render-primary
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}

      - name: Deploy primary workload
        if: inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-primary.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Verify public workload health
        if: inputs.mode == 'deploy'
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors "$WORKLOAD_URL/healthz"

      # Published only once primary is confirmed healthy, so a failed deploy never leaves a
      # broken digest for a future terraform apply to redeploy.
      - name: Publish workload image digest (deploy)
        if: inputs.mode == 'deploy'
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          aws ssm put-parameter --name "$IMAGE_DIGEST_PARAMETER" \
            --type String --value "$IMAGE_DIGEST" --overwrite >/dev/null
          echo "## Published workload image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ECR_REPOSITORY@$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      # Secondary's ECR repository only exists once the secondary root is applied, so publish-only
      # runs (which precede it) must not wait on replication.
      - name: Wait for image replication to secondary
        if: inputs.mode == 'deploy'
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          for _ in {1..60}; do
            if aws ecr describe-images --region "$SECONDARY_AWS_REGION" \
              --repository-name "$ECR_REPOSITORY" --image-ids imageDigest="$IMAGE_DIGEST" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "ECR image did not replicate to secondary within 10 minutes." >&2
          exit 1

      - name: Read current secondary task definition
        if: inputs.mode == 'deploy'
        run: |
          aws ecs describe-task-definition --region "$SECONDARY_AWS_REGION" \
            --task-definition "$SECONDARY_ECS_SERVICE" --query taskDefinition > secondary-task-definition.json

      - name: Log in to Amazon ECR (Secondary region)
        if: inputs.mode == 'deploy'
        id: login-ecr-secondary
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_DEFAULT_REGION: ${{ env.SECONDARY_AWS_REGION }}
          AWS_REGION: ${{ env.SECONDARY_AWS_REGION }}

      - name: Render secondary task definition
        if: inputs.mode == 'deploy'
        id: render-secondary
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: secondary-task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr-secondary.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}

      - name: Deploy secondary pilot-light task definition
        if: inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        env:
          AWS_DEFAULT_REGION: ${{ env.SECONDARY_AWS_REGION }}
          AWS_REGION: ${{ env.SECONDARY_AWS_REGION }}
        with:
          task-definition: ${{ steps.render-secondary.outputs.task-definition }}
          cluster: ${{ env.SECONDARY_ECS_CLUSTER }}
          service: ${{ env.SECONDARY_ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 5
