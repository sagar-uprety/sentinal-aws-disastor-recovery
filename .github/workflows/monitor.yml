name: Monitor CI/CD

on:
  pull_request:
    paths:
      - "apps/monitor/**"
      - ".github/workflows/monitor.yml"
  push:
    branches: [main]
    paths:
      - "apps/monitor/**"
      - ".github/workflows/monitor.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Publish only for initial monitoring infrastructure, or deploy to the isolated service.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - publish-only

permissions:
  contents: read

concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1
  CONTAINER_NAME: sentinel-monitor
  ECR_REPOSITORY: sentinel-aws-dr-monitoring
  ECS_CLUSTER: sentinel-aws-dr-monitoring
  ECS_SERVICE: sentinel-aws-dr-monitoring
  MONITOR_URL: https://sentinel.sagaruprety.com.np

jobs:
  quality:
    name: Test and build monitor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/monitor
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/monitor/go.mod
          cache-dependency-path: apps/monitor/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/monitor/package-lock.json

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Run Go checks
        run: go vet ./... && go test -race ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 monitor image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/monitor
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=monitor
          cache-to: type=gha,mode=max,scope=monitor

  deploy:
    name: Deploy isolated monitor
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ env.MONITOR_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_MONITOR_ROLE_ARN }}
          role-session-name: monitor-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable monitor image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/monitor
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=monitor
          cache-to: type=gha,mode=max,scope=monitor

      - name: Report monitor image digest
        env:
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          echo "## Published monitor image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ECR_REPOSITORY@$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Read current monitor task definition
        if: inputs.mode == 'deploy'
        run: aws ecs describe-task-definition --task-definition "$ECS_SERVICE" --query taskDefinition > task-definition.json

      - name: Render monitor task definition
        if: inputs.mode == 'deploy'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}

      - name: Deploy monitor task definition
        if: inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Verify public monitor health
        if: inputs.mode == 'deploy'
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors "$MONITOR_URL/healthz"
