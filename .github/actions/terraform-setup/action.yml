name: Terraform setup
description: >-
  Install Terraform and optionally assume an AWS role. Run actions/checkout before this step,
  since a local composite action can't check out the repo it's defined in.

inputs:
  terraform-version:
    description: Terraform version to install. Defaults to the pinned .terraform-version.
    required: false
    default: ""
  role-arn:
    description: IAM role to assume. Leave empty to skip AWS credential configuration (e.g. offline validate jobs).
    required: false
    default: ""
  aws-region:
    description: AWS region for the assumed role. Required when role-arn is set.
    required: false
    default: ""
  session-name:
    description: Role session name. Required when role-arn is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # .terraform-version is the single pin shared with tfenv and local runs.
    - name: Resolve Terraform version
      id: version
      shell: bash
      run: |
        version="${{ inputs.terraform-version }}"
        if [ -z "$version" ]; then
          version="$(tr -d '[:space:]' < .terraform-version)"
        fi
        if [ -z "$version" ]; then
          echo "error: no terraform version supplied and .terraform-version is empty" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false

    - name: Configure AWS credentials
      if: inputs.role-arn != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: ${{ inputs.session-name }}
        aws-region: ${{ inputs.aws-region }}
